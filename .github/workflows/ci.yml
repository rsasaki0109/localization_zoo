name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']

jobs:
  fixed-leaderboard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fixed configuration contracts and generated artifacts
        run: |
          python3 -m unittest discover -s tests -p test_fixed_leaderboard.py -v
          python3 evaluation/scripts/generate_fixed_leaderboard.py --check

  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y \
            build-essential cmake \
            libeigen3-dev \
            libpcl-dev \
            libopencv-dev \
            libceres-dev \
            libunwind-dev \
            libgtest-dev

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-lock.txt

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Python bindings smoke
        run: python3 python/example_synthetic.py

      - name: Upload paper Python fixture parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-python-fixture
          path: build/python/paper_python_fixture.json
          if-no-files-found: ignore

      - name: Dogfooding smoke (committed 3-frame MCD fixture ~3MB)
        run: |
          chmod +x evaluation/scripts/smoke_ci_fixture.sh
          bash evaluation/scripts/smoke_ci_fixture.sh

      - name: Fixture result drift check (golden metrics)
        run: |
          python3 evaluation/scripts/check_fixture_golden.py \
            --summaries experiments/results/runs/ci_fixture_smoke \
            --golden evaluation/fixtures/mcd_kth_smoke_golden.json \
            --actual-out fixture-golden-actual/mcd_kth_smoke_golden.json

      - name: Upload fixture golden actual values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-golden-actual
          path: fixture-golden-actual/
          if-no-files-found: ignore

      - name: Multimodal smoke (committed 3-frame MCD fixture + visual CSVs)
        run: |
          chmod +x evaluation/scripts/smoke_multimodal_fixture.sh
          bash evaluation/scripts/smoke_multimodal_fixture.sh

      - name: 2D scan smoke (committed Intel Lab val slice, 20 frames)
        run: |
          chmod +x evaluation/scripts/smoke_scan2d_fixture.sh
          bash evaluation/scripts/smoke_scan2d_fixture.sh

      - name: 2D scan long smoke (committed MIT/Intel train slices, 20 frames)
        run: |
          chmod +x evaluation/scripts/smoke_scan2d_long_fixture.sh
          bash evaluation/scripts/smoke_scan2d_long_fixture.sh

      - name: One-command demo report
        run: |
          bash evaluation/scripts/demo_localization_zoo.sh --skip-build
          python3 evaluation/scripts/validate_showcase.py \
            --require-demo \
            --demo-dir experiments/results/runs/demo_localization_zoo

      - name: Upload demo report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-zoo-demo-report
          path: experiments/results/runs/demo_localization_zoo/
          if-no-files-found: ignore
          retention-days: 14

      - name: Python script regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: LiDAR v10 release contract
        run: |
          python3 -m unittest -q \
            tests/test_direction_consistent_rotation_fusion.py \
            tests/test_lidar_v10_manifest.py \
            tests/test_lidar_sota_tools.py \
            tests/test_official_kiss_pcd_odometry.py \
            tests/test_external_odometry_evaluator.py \
            tests/test_reproduce_lidar_v10.py \
            tests/test_boreas_window_tools.py

  ros2-colcon-build:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble

    steps:
      - uses: actions/checkout@v4

      - name: Install ROS2 build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            libeigen3-dev \
            libpcl-dev \
            libopencv-dev \
            libceres-dev \
            python3-colcon-common-extensions \
            ros-humble-ament-cmake \
            ros-humble-rclcpp \
            ros-humble-sensor-msgs \
            ros-humble-geometry-msgs \
            ros-humble-nav-msgs \
            ros-humble-std-msgs \
            ros-humble-tf2-ros \
            ros-humble-tf2-eigen \
            ros-humble-pcl-conversions \
            ros-humble-pcl-ros \
            ros-humble-rclpy \
            ros-humble-tf2-msgs \
            python3-numpy

      - name: Build ROS2 package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2
          colcon build --packages-select localization_zoo_ros

      - name: Paper odometry nodes (native fixture parity, odometry and TF)
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2
          source install/setup.bash
          python3 localization_zoo_ros/test/test_paper_nodes.py \
            --node-dir install/localization_zoo_ros/lib/localization_zoo_ros \
            --reference build/localization_zoo_ros/paper_odometry_reference \
            --report paper_ros_fixture.json

      - name: Upload paper ROS fixture parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ros-fixture
          path: ros2/paper_ros_fixture.json
          if-no-files-found: ignore
