name: Stereo VO baseline
on:
  pull_request:
    paths: ['python/stereo_vo.py', 'python/test/test_stereo_vo.py', '.github/workflows/stereo-vo.yml']
  push:
    branches: [main]
    paths: ['python/stereo_vo.py', 'python/test/test_stereo_vo.py', '.github/workflows/stereo-vo.yml']
jobs:
  image-geometry:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86
      - run: python3 -m unittest discover -s python/test -p test_stereo_vo.py -v
