# Kalibr-style IMU noise model from the TUM VI static recording (BMI160),
# reproduced with papers/allan_variance; values as measured, not inflated.
accelerometer_noise_density: 1.3391e-03  # m/s^2/sqrt(Hz)
accelerometer_random_walk: 8.5033e-05  # m/s^3/sqrt(Hz)
gyroscope_noise_density: 8.0473e-05  # rad/s/sqrt(Hz)
gyroscope_random_walk: 2.1655e-06  # rad/s^2/sqrt(Hz)
update_rate: 199.4  # Hz
